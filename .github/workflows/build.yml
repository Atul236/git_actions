name: Build Package 
on: [push, pull_request]
jobs:
  test_git_actions1:
    name: test seleniem job1
    runs-on: ubuntu-latest
    env:
      SELENIUM_DRIVER: 'remote driver'
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event on ${{runner.os}}"   #  the thing which we have used like event.name or runner .os these are called context 
      - name: checkout source code 
        uses: actions/checkout@v6.0.1
      - run: echo " this repo is ${{ github.repository}} "
      - name: run a script file from repo  file 
        run : sh ./run.sh
        shell: bash
      - name: selenium test
        if: ${{env.SELENIUM_DRIVER == 'remote driver'}}         # instead expression if we write always it will run always even if avove test gets failed, so if we want some thing to run always then we will use always as expression
        run: echo "running test in remote selenium driver "
    
      
  test_git_actions2:
    name: test seleniem job2
    runs-on: ubuntu-latest
    needs: test_git_actions1          # to add dependency on first job 
    steps:
    - run: echo "this is second job "
  # without dependency both will run sequencially ,, if parent job fails it wont execute if we want some jobs to always 
  # run even if above jobs get fails we can use always command 

